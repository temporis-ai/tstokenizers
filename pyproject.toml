[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tstokenizers"
version = "0.1.1"
description = "Time series tokenizer for autoregressive modeling"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Yi Jiang", email = "yijiang@temporis.co" }]
dependencies = ["datasets~=4.8.4", "numpy~=2.0", "pandas~=2.2", "scipy~=1.15", "tokenizers~=0.21.4", "transformers~=4.51.3"]

[project.urls]
Repository = "https://github.com/temporis-ai/tstokenizers"

[project.scripts]
tstokenizers-train = "tstokenizers.train_tokenizer:main"
